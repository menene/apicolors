services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8087}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ping')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
